services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shortlistiq
      POSTGRES_PASSWORD: shortlistiq
      POSTGRES_DB: shortlistiq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlistiq -d shortlistiq"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://shortlistiq:shortlistiq@db:5432/shortlistiq
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
