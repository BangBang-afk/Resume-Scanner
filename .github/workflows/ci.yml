name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt httpx
      - name: Tests
        run: python -m pytest backend/tests/ -q
      - name: Eval regression budget
        run: |
          cd backend   # eval imports app.* via its own sys.path setup
        # run from repo root; the script inserts backend/ on sys.path itself
          cd ..
          python eval/run_eval.py | tee eval_out.txt
          python - <<'PY'
          import re, sys
          out = open("eval_out.txt").read()
          f1 = float(re.search(r"F1=([\d.]+)", out).group(1))
          delta = float(re.search(r"name-swap delta=([\d.]+)", out).group(1))
          ok = f1 >= 0.75 and delta <= 1.0
          print(f"budget check: F1={f1} delta={delta} -> {'PASS' if ok else 'FAIL'}")
          sys.exit(0 if ok else 1)
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
